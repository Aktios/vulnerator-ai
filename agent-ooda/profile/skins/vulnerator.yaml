# vulnerator.yaml — custom Hermes skin for the Vulnerator-AI OODA pentest engine.
# Palette and visual language aligned with the README and landing page.
# Loaded from <hermes_home>/skins/vulnerator.yaml and activated via
# `display.skin: vulnerator` in config.yaml.

name: "vulnerator"
description: "Vulnerator-AI — unholy pentest / OODA terminal skin"

# ── Branding ──────────────────────────────────────────────────────────────────
branding:
  agent_name: "Vulnerator-AI"
  welcome: "UNHOLY PENTEST // OODA engine online. Declare authorized target and mode."
  goodbye: "Engagement sealed. Evidence persists."
  response_label: " VULNERATOR // OODA "
  prompt_symbol: "V>"
  help_header: "VULNERATOR // COMMAND INDEX"

# ── Colors — landing-page palette ─────────────────────────────────────────────
# Metal and dark red carry the identity. Matrix green is reserved for confirmed
# success and live/armed state rather than used as a general brand color.
colors:
  banner_border:                   "#b03a3a"
  banner_title:                    "#c75a5a"
  banner_accent:                   "#c75a5a"
  banner_dim:                      "#663333"
  banner_text:                     "#e6e8ec"

  ui_accent:                       "#c75a5a"
  ui_label:                        "#9aa0ac"
  ui_ok:                           "#00FF41"
  ui_error:                        "#ef5350"
  ui_warn:                         "#ffa726"

  prompt:                          "#e6e8ec"
  input_rule:                      "#b03a3a"
  response_border:                 "#c75a5a"

  status_bar_bg:                   "#080b14"
  status_bar_text:                 "#9aa0ac"
  status_bar_strong:               "#c75a5a"
  status_bar_dim:                  "#1c2130"
  status_bar_good:                 "#00FF41"
  status_bar_warn:                 "#ffa726"
  status_bar_bad:                  "#c75a5a"
  status_bar_critical:             "#b03a3a"

  session_label:                   "#c75a5a"
  session_border:                  "#1c2130"

  completion_menu_bg:              "#0a0a0a"
  completion_menu_current_bg:      "#10131c"
  completion_menu_meta_bg:         "#080b14"
  completion_menu_meta_current_bg: "#1c2130"

  selection_bg:                    "#10131c"
  shell_dollar:                    "#00FF41"
  voice_status_bg:                 "#080b14"

# ── Spinner — truthful OODA state language ────────────────────────────────────
spinner:
  thinking_verbs:
    - "observing surface"
    - "orienting evidence"
    - "deciding next action"
    - "correlating findings"
    - "mapping attack surface"
    - "verifying evidence"
  thinking_faces:
    - "[O]"
    - "[O]"
    - "[D]"
    - "[A]"
  waiting_faces:
    - "[·]"
    - "[•]"
    - "[●]"
    - "[•]"
  wings:
    - ["⟦", "⟧"]
    - ["╾", "╼"]

tool_prefix: "▸"

# MCP tools are registered with their fully qualified runtime names. Symbols are
# monochrome and single-cell where possible so activity lines stay aligned.
tool_emojis:
  mcp__kali__kali_run:       "▶"
  mcp__kali__kali_exec:      "▷"
  mcp__kali__record_finding: "◆"
  mcp__kali__read_findings:  "◇"

