# vulnerator.yaml — custom Hermes skin for the Vulnerator OODA pentest engine.
# Loaded by Hermes skin_engine from <hermes_home>/skins/vulnerator.yaml.
# Activated via `display.skin: vulnerator` in config.yaml.
# Copied from agent-ooda/profile/skins/ to /opt/data/skins/ by the
# docker-compose ooda-agent startup script on every container boot.

name: "vulnerator"
description: "Vulnerator OODA engine — red-team cyber theme"

# ── Branding ──────────────────────────────────────────────────────────────────
branding:
  agent_name: "Vulnerator-AI"
  welcome: "Vulnerator-AI OODA engine online. Define your target and engage."
  goodbye: "Engagement terminated. ⚡"
  response_label: " ⚡ Vulnerator-AI "
  prompt_symbol: "⚡"
  help_header: "(⚡) Available Commands"

# ── Colors (dark red / cyber-green palette) ───────────────────────────────────
colors:
  banner_border:             "#CC0000"
  banner_title:              "#00FF41"
  banner_accent:             "#FF4444"
  banner_dim:                "#AA2222"
  banner_text:               "#E8E8E8"
  ui_accent:                 "#FF4444"
  ui_label:                  "#CC3333"
  ui_ok:                     "#00FF41"
  ui_error:                  "#FF2222"
  ui_warn:                   "#FF8800"
  prompt:                    "#E8E8E8"
  input_rule:                "#CC0000"
  response_border:           "#00FF41"
  status_bar_bg:             "#180000"
  status_bar_text:           "#BB8888"
  status_bar_strong:         "#00FF41"
  status_bar_dim:            "#663333"
  status_bar_good:           "#00FF41"
  status_bar_warn:           "#FF8800"
  status_bar_bad:            "#FF4444"
  status_bar_critical:       "#FF0000"
  session_label:             "#CC3333"
  session_border:            "#882222"
  completion_menu_bg:        "#180000"
  completion_menu_current_bg: "#3A0000"
  selection_bg:              "#2A0000"
  shell_dollar:              "#00FF41"
  voice_status_bg:           "#180000"

# ── Spinner ───────────────────────────────────────────────────────────────────
spinner:
  thinking_verbs:
    - "scanning"
    - "enumerating"
    - "exploiting"
    - "pivoting"
    - "exfiltrating"
    - "mapping attack surface"
    - "probing defenses"
    - "chaining vectors"
    - "escalating privileges"
    - "persisting access"
  thinking_faces:
    - "(⚡)"
    - "(⚠)"
    - "(▶)"
    - "(◎)"
    - "(⟳)"
  waiting_faces:
    - "(⚡)"
    - "(▶)"
    - "(◎)"
    - "(⟳)"
  wings:
    - ["⟪⚡", "⚡⟫"]
    - ["⟪▶", "◀⟫"]
    - ["⟪◎", "◎⟫"]

tool_prefix: "▸"

