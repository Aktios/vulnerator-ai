# ── customCSS — Vulnerator-AI theme for the web dashboard (:9119) ─────────────
# Injects into the Hermes web dashboard while this skin is active.
# Palette mirrors the landing page (irraz.github.io/vulnerator-ai).
customCSS: |
  :root {
    --hermes-bg:           #0a0a0a;
    --hermes-bg-deep:      #080b14;
    --hermes-panel:        #10131c;
    --hermes-panel-edge:   #1c2130;
    --hermes-text:         #e6e8ec;
    --hermes-muted:        #9aa0ac;
    --hermes-accent:       #b03a3a;
    --hermes-accent-soft:  #c75a5a;
    --hermes-green:        #00FF41;
  }
  body, html {
    background: var(--hermes-bg) !important;
    color: var(--hermes-text) !important;
    font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace !important;
  }
  /* Panels and cards */
  [class*="panel"], [class*="card"], [class*="sidebar"],
  [class*="drawer"], [class*="modal"], [class*="dialog"] {
    background: var(--hermes-panel) !important;
    border-color: var(--hermes-panel-edge) !important;
  }
  /* Links and accents */
  a { color: var(--hermes-accent-soft) !important; }
  a:hover { color: var(--hermes-green) !important; }
  /* Input fields */
  input, textarea, [role="textbox"] {
    background: var(--hermes-bg-deep) !important;
    color: var(--hermes-text) !important;
    border-color: var(--hermes-panel-edge) !important;
  }
  input:focus, textarea:focus {
    border-color: var(--hermes-accent) !important;
    outline: none !important;
  }
  /* Buttons */
  button[class*="primary"], [class*="btn-primary"] {
    background: var(--hermes-accent) !important;
    border-color: var(--hermes-accent) !important;
    color: #fff !important;
  }
  /* Scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--hermes-bg); }
  ::-webkit-scrollbar-thumb { background: var(--hermes-accent); border-radius: 3px; }
