  banner_border:                 "#b03a3a"   # landing --accent
  banner_title:                  "#00FF41"   # matrix green — pentest identity
  banner_accent:                 "#c75a5a"   # landing --accent-soft
  banner_dim:                    "#663333"
  banner_text:                   "#e6e8ec"   # landing --text

  # UI
  ui_accent:                     "#c75a5a"   # landing --accent-soft
  ui_label:                      "#9aa0ac"   # landing --muted
  ui_ok:                         "#00FF41"   # matrix green for success
  ui_error:                      "#ef5350"
  ui_warn:                       "#ffa726"

  # Input / prompt
  prompt:                        "#e6e8ec"   # landing --text
  input_rule:                    "#b03a3a"   # landing --accent

  # Response
  response_border:               "#c75a5a"   # landing --accent-soft

  # Status bar — deep space blue-black from landing
  status_bar_bg:                 "#080b14"   # landing --bg-deep
  status_bar_text:               "#9aa0ac"   # landing --muted
  status_bar_strong:             "#00FF41"
  status_bar_dim:                "#1c2130"   # landing --panel-edge
  status_bar_good:               "#00FF41"
  status_bar_warn:               "#ffa726"
  status_bar_bad:                "#c75a5a"
  status_bar_critical:           "#b03a3a"

  # Sessions
  session_label:                 "#c75a5a"
  session_border:                "#1c2130"   # landing --panel-edge

  # Completion menu — landing panel tones
  completion_menu_bg:            "#0a0a0a"   # landing --bg
  completion_menu_current_bg:    "#10131c"   # landing --panel
  completion_menu_meta_bg:       "#080b14"   # landing --bg-deep
  completion_menu_meta_current_bg: "#1c2130" # landing --panel-edge

  # Selection / shell
  selection_bg:                  "#10131c"   # landing --panel
  shell_dollar:                  "#00FF41"
  voice_status_bg:               "#080b14"   # landing --bg-deep

# ── Spinner ───────────────────────────────────────────────────────────────────
spinner:
  thinking_verbs:
    - "scanning"
    - "enumerating"
    - "exploiting"
    - "pivoting"
    - "exfiltrating"
    - "mapping attack surface"
    - "probing defenses"
    - "chaining vectors"
    - "escalating privileges"
    - "persisting access"
  thinking_faces:
    - "(⚡)"
    - "(⚠)"
    - "(▶)"
    - "(◎)"
    - "(⟳)"
  waiting_faces:
    - "(⚡)"
    - "(▶)"
    - "(◎)"
    - "(⟳)"
  wings:
    - ["⟪⚡", "⚡⟫"]
    - ["⟪▶", "◀⟫"]
    - ["⟪◎", "◎⟫"]

tool_prefix: "▸"

# ── Tool emojis — per-tool overrides ─────────────────────────────────────────
