# vulnerator.yaml — custom Hermes skin for the Vulnerator-AI OODA pentest engine.
# Palette aligned with the Vulnerator-AI landing page (irraz.github.io/vulnerator-ai).
# Loaded by Hermes skin_engine from <hermes_home>/skins/vulnerator.yaml.
# Activated via `display.skin: vulnerator` in config.yaml.
# Copied from agent-ooda/profile/skins/ to /opt/data/skins/ by the
# docker-compose ooda-agent startup script on every container boot.

name: "vulnerator"
description: "Vulnerator-AI OODA engine — dark red / cyber theme (aligned with landing page)"

# ── Branding ──────────────────────────────────────────────────────────────────
branding:
  agent_name: "Vulnerator-AI"
  welcome: "Vulnerator-AI OODA engine online. Define your target and engage."
  goodbye: "Engagement terminated. ⚡"
  response_label: " ⚡ Vulnerator-AI "
  prompt_symbol: "⚡"
  help_header: "(⚡) Available Commands"

# ── Colors — aligned with landing page palette ────────────────────────────────
# Landing page variables for reference:
#   --bg: #0a0a0a  --bg-deep: #080b14  --panel: #10131c  --panel-edge: #1c2130
#   --text: #e6e8ec  --muted: #9aa0ac  --accent: #b03a3a  --accent-soft: #c75a5a
colors:
