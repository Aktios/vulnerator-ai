# =============================================================================
# docker-compose.target.yml — target web VULNERABLE A PROPOSITO para pruebas.
# =============================================================================
# Override OPCIONAL para escenarios de prueba de la skill `web-pentest`. NO forma parte
# del stack base (docker-compose.yml): se levanta explicitamente junto a el para tener un
# objetivo contra el que practicar sin salir a internet ni tocar sistemas reales.
#
#   docker compose -f docker-compose.yml -f docker-compose.target.yml up -d
#
# El target vive en la MISMA red interna del compose, asi que Hermes/Kali lo alcanzan por
# su nombre DNS `juice-shop:3000`. NO se publica ningun puerto al host: el objetivo solo
# existe dentro de la red de docker, acotando el ejercicio al entorno controlado.
#
# OWASP Juice Shop: aplicacion web deliberadamente insegura (proyecto OWASP, MIT), el
# estandar de facto para practicar pentest web (XSS, SQLi, auth, etc.).

services:
  juice-shop:
    image: bkimminich/juice-shop
    # SIN sección ports: el target NO se publica al host; solo es alcanzable por la red
    # interna de docker (Hermes lo ve como http://juice-shop:3000). Mantiene el ejercicio
    # confinado al entorno controlado.
    restart: unless-stopped
    # Healthcheck: la raiz responde 200 cuando la app esta lista. La imagen trae node pero
    # no curl/wget garantizados, asi que se usa node (siempre presente) para el sondeo.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
