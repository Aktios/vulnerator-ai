# =============================================================================
# vulnerator-ai — OODA pentest with Hermes talking DIRECTLY to Kali-MCP.
# =============================================================================
# What it is: an OODA pentest loop driven by Hermes (nousresearch/hermes-agent)
# that runs tools DIRECTLY via MCP servers (no intermediate core/API/UI):
#   - kali          : deterministic pentest tool runtime (kali-mcp on :8900).
#   - playwright-mcp : real browser (headless Chromium) over MCP (:8931) for the web part.
#   - ooda-agent    : Hermes as the BRAIN driving the OODA loop, client of both MCPs
#                     (kali:8900, playwright-mcp:8931). OODA driver, no intermediaries.
#
# Startup:
#   cp .env.example .env   # and fill in OPENROUTER_API_KEY and HERMES_API_SERVER_KEY
#   docker compose up -d --build
#   docker compose exec -it ooda-agent hermes chat   # interactive TUI
#
# WARNING (intentional): this product has NO scope-guard, consent, or
# audit. Hermes runs whatever it decides directly against the target, with no gatekeeper
# validating the scope. Use it ONLY against explicitly authorized targets and in a
# controlled environment. Responsibility for the scope rests entirely with the operator.
#
# Multi-arch: each build declares platforms [linux/arm64, linux/amd64]. On a Mac M2
# it runs arm64 natively.

services:
  kali:
    build:
      context: .
      dockerfile: docker/kali/Dockerfile
      platforms:
        - linux/arm64
        - linux/amd64
    image: vulnerator-ai-kali:dev
    environment:
      # --- AWS read-only (OPTIONAL in this product) ---
      # Prowler/ScoutSuite/Cloudsplaining run INSIDE this container. If you are going
      # to use the cloud collection tools, set these credentials in .env; otherwise
      # they stay empty and the cloud tools simply won't have anything to authenticate with.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      # Optional: only for temporary credentials (STS).
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      # kali-mcp server port inside the container. Overridable without rebuilding.
      KALI_MCP_PORT: "8900"
      # --- Artifacts DATA plane (dedicated port, internal network) ---
      KALI_ARTIFACTS_PORT: "8901"
      # Shared token for the data channel (optional in this product).
      KALI_ARTIFACTS_TOKEN: "${KALI_ARTIFACTS_TOKEN:-}"
      # --- Prowler (optional): scopes the cloud scan if used ---
      PROWLER_STATUS: "${PROWLER_STATUS:-FAIL}"
      PROWLER_REGIONS: "${PROWLER_REGIONS-${AWS_REGION:-us-east-1}}"
      PROWLER_SERVICES: "${PROWLER_SERVICES-iam s3}"
      PROWLER_TIMEOUT: "${PROWLER_TIMEOUT:-1800}"
    # kali-mcp server port (exposed for direct inspection from the host if
    # needed; ooda-agent reaches it over the internal network as kali:8900). The host
    # port is configurable with KALI_MCP_HOST_PORT (default 8900) without editing this file;
    # the container's internal port stays 8900.
    ports:
      - "${KALI_MCP_HOST_PORT:-8900}:8900"
    # HEALTHCHECK: checks that the MCP server accepts TCP connections on :8900, so that
    # ooda-agent can depend on it with condition: service_healthy before starting.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('localhost',8900))==0 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  ooda-agent:
    # Official registry image (NOT built from this repo).
    image: nousresearch/hermes-agent
    # Startup ("default profile" model): recreates the DEFAULT profile (/opt/data) by copying
    # the repo's declarative template (read-only bind-mount at /opt/profile-src),
    # injects the API server key and starts the gateway in the foreground. 'hermes gateway
    # run' keeps the container ALIVE and starts platforms.api_server (:8642, published to the
    # host via the 'ports:' block below to drive Hermes from an external assistant).
    command:
      - sh
      - -c
      - |
        set -e
        # The DEFAULT profile is the root home /opt/data (not /opt/data/profiles/<p>).
        DEF=/opt/data
        # (a) copy the declarative template (config/SOUL/skills) to the default profile home.
        mkdir -p "$$DEF/skills"
        cp /opt/profile-src/profile/config.yaml "$$DEF/config.yaml"
        cp /opt/profile-src/profile/SOUL.md "$$DEF/SOUL.md"
        cp -r /opt/profile-src/skills/. "$$DEF/skills/" 2>/dev/null || true
        # (b) inject the API server KEY (secret, not versioned) BEFORE starting.
        hermes config set platforms.api_server.key "$$HERMES_API_SERVER_KEY" >/dev/null
        # (b2) OPTIONAL model override: if OPENROUTER_MODEL is set and non-empty, override
        # model.default at runtime. If empty/unset, do nothing so the profile's model.default
        # (mistralai/mistral-large-4-0) is used as-is (fallback).
        if [ -n "$$OPENROUTER_MODEL" ]; then
          hermes config set model.default "$$OPENROUTER_MODEL" >/dev/null
        fi
        # (c) start the default profile gateway: foreground (live container) + API server.
        exec hermes gateway run
    environment:
      # Hermes API server key — required (fail-closed): min 8 chars. TWO paths are
      # needed: the command writes it into platforms.api_server.key (to start the
      # API server) and API_SERVER_KEY validates it on every request (to authenticate the Bearer).
      HERMES_API_SERVER_KEY: "${HERMES_API_SERVER_KEY:?Falta HERMES_API_SERVER_KEY - genera uno con 'openssl rand -hex 32' (min 8 chars) y ponlo en .env}"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY}"
      # API key for Hermes' LLM provider. Hermes reads the LLM key from THIS env var
      # (OPENROUTER_API_KEY), which is why HERMES_LLM_API_KEY is NOT declared. Required
      # fail-closed: without it the agent cannot reason.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?Falta OPENROUTER_API_KEY - define la API key de OpenRouter en .env}"
      # OPTIONAL OpenRouter model override (NOT fail-closed): empty default. When set and
      # non-empty, the startup command runs 'hermes config set model.default' to override the
      # profile's model.default; when empty/unset, the profile default is used (fallback).
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
    volumes:
      # NAMED VOLUME REQUIRED (never a bind-mount): Hermes' state.db SQLite in WAL mode
      # GETS CORRUPTED on bind-mounts that cross the macOS VM (virtiofs).
      - hermes-data:/opt/data
      # Declarative profile template, READ-ONLY and OUTSIDE /opt/data (does not touch the WAL).
      - ./agent-ooda:/opt/profile-src:ro
    # Interactive TUI: 'docker compose exec -it ooda-agent hermes chat' needs stdin+tty.
    stdin_open: true
    tty: true
    # Publishes Hermes' OpenAI-compatible API server (:8642) to the host so you can DRIVE
    # Hermes from an external assistant (Kiro/Claude) over HTTP, without entering the TUI. The host
    # port is configurable with HERMES_API_HOST_PORT (default 8642) without editing this file;
    # the container's internal port stays 8642.
    #
    # SECURITY: publishing this port LOWERS the network barrier the stack had on purpose
    # (before, :8642 was only reachable over the internal docker network). From here on the
    # endpoint's protection is the HERMES_API_SERVER_KEY Bearer (same key from .env): use it
    # ONLY on a controlled machine/environment. If you don't want to open the port, delete this
    # 'ports:' block and drive Hermes with 'docker compose exec ooda-agent curl ...' (see README).
    ports:
      - "${HERMES_API_HOST_PORT:-8642}:8642"
    depends_on:
      # Wait until kali is healthy (MCP listening) before starting.
      kali:
        condition: service_healthy
      # Wait until the browser MCP is healthy before starting.
      playwright-mcp:
        condition: service_healthy
    restart: unless-stopped
    # Default compose network: reaches kali:8900 and playwright-mcp:8931 via internal DNS.

  playwright-mcp:
    # Second MCP server of the stack: real browser (headless Chromium) for the
    # WEB part of the pentest. Official Microsoft image (NOT built from this repo).
    # Hermes registers it as the `playwright` MCP (see agent-ooda/profile/config.yaml) and gains
    # the `mcp_playwright_*` tools WITHOUT re-enabling any native toolset: it follows the
    # "everything goes through MCP" principle. The web part is NOT limited to kali_run: nmap/whatweb/nuclei/
    # ffuf/sqlmap go through the Kali (kali_run) and navigation/DOM/XSS go through this MCP.
    image: mcr.microsoft.com/playwright/mcp
    # HTTP (streamable-http) on :8931, MCP endpoint at /mcp. --no-sandbox: Chromium runs
    # as root in the container without userns. --headless: no display. Internal network only.
    entrypoint: ["node"]
    command:
      - /app/cli.js
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --port
      - "8931"
      - --host
      - "0.0.0.0"
      # Playwright server anti-DNS-rebinding protection: by default it ONLY accepts the
      # host it is bound to (localhost), so it rejects Hermes' connection with 403,
      # which arrives with the Host header `playwright-mcp:8931` (the service's internal DNS name).
      # That host is EXPLICITLY allowed (not `*`): it keeps the protection scoped to the
      # internal docker network, from which ooda-agent connects.
      - --allowed-hosts
      - "playwright-mcp:8931"
      # IN-MEMORY browser profile (not persisted to disk). A persistent profile can ONLY
      # be used by ONE instance at a time and LOCKS ("Browser is already in use ...") if
      # an orphan Chrome process remains or there are concurrent calls; that left the
      # mcp_playwright_* tools unusable mid-engagement. With --isolated each session starts its
      # own ephemeral profile: no shared profile lock.
      - --isolated
    init: true
    # HEALTHCHECK: the MCP endpoint responds on :8931 (a live process responds to the
    # HTTP handshake), so that ooda-agent can depend on it with condition: service_healthy.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8931/mcp',r=>process.exit(r.statusCode?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # NO ports section: the browser MCP is NOT published to the host; internal docker network only.
    restart: unless-stopped

volumes:
  # Hermes state (profile + SQLite WAL). NAMED on purpose: avoids the bind-mount
  # that corrupts the SQLite WAL on macOS virtiofs.
  hermes-data:
