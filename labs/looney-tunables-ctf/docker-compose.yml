# Lab CTF local — LPE challenge (ubuntu-server-01)
#
# El nombre del contenedor y hostname son neutros a proposito: no dan pista
# alguna sobre el vector de ataque. El agente debe enumerarlo y descubrirlo.

services:
  ctf-target:
    build:
      context: .
      dockerfile: Dockerfile
    # x86-64 obligatorio: el exploit de la vulnerabilidad objetivo es
    # dependiente de arquitectura. En Apple Silicon se emula via QEMU/Rosetta.
    platform: linux/amd64
    image: ctf-lpe-target:lab
    container_name: ubuntu-server-01
    hostname: ubuntu-server-01

    # Red compartida con el stack hermes-pentest: Vulnerator y Kali
    # alcanzan el objetivo por hostname (ubuntu-server-01) o IP.
    networks:
      - vulnerator-ai

    stdin_open: true
    tty: true

    security_opt:
      - no-new-privileges:false   # el PoC necesita binarios setuid operativos
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_CHROOT   # sshd privsep sandbox requiere chroot()

    mem_limit: 1g
    pids_limit: 512

    restart: "no"

networks:
  vulnerator-ai:
    external: true
    name: vulnerator-ai_default
