services:
  php:
    image: php:8.2.34-fpm
    container_name: php2shell-fpm
    volumes:
      - ./webroot:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
    ports:
      - "127.0.0.1:9000:9000"
    security_opt:
      - seccomp:unconfined
    privileged: true
    command: bash -c "mkdir -p /tmp/sessions && chmod 1777 /tmp/sessions && php-fpm"

  nginx:
    image: nginx:alpine
    container_name: php2shell-nginx
    volumes:
      - ./webroot:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - php

  apache:
    image: php:8.2.34-apache
    container_name: php2shell-apache
    volumes:
      - ./webroot:/var/www/html
      - ./php-apache.ini:/usr/local/etc/php/php.ini
    ports:
      - "127.0.0.1:18081:80"
